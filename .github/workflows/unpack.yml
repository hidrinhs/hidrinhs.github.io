name: Unpack portfolio site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and extract portfolio
        run: |
          cat site.zip.part-* > site.zip
          unzip -o site.zip
          rm -f site.zip site.zip.part-*
      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish portfolio site"
          git push
